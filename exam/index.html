<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exam Conditioning</title>
<meta name="description" content="Build up to the full 4-hour real estate exam, one level at a time.">
<style>
:root{
  --b-accent:#14C3E8; --b-accent-light:#42D0F8; --b-accent-text:#0B7C95;
  --b-primary:#383D45; --b-on-primary:#ffffff; --b-slate:#4C5A65;
  --b-ink:#202A30; --b-paper:#FAF9F6; --b-muted:#59636A; --b-line:#D9DEDC; --b-tint:#EDF9FD;
  --font-head: Newsreader, "Iowan Old Style", "Palatino Linotype", Charter, "Bitstream Charter", Georgia, serif;
  --font-body: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace;
  --radius:18px; --radius-sm:12px;
}
:root, :root[data-theme="light"]{
  --paper:var(--b-paper); --card:#ffffff; --ink:var(--b-ink); --muted:var(--b-muted); --line:var(--b-line);
  --tint:var(--b-tint); --accent:var(--b-accent); --accent-text:var(--b-accent-text);
  --primary:var(--b-primary); --on-primary:var(--b-on-primary); --slate:var(--b-slate);
  --good:#1D7348; --good-bg:#E5F3EA; --bad:#B0382B; --bad-bg:#FBE9E6; --warn:#875700; --warn-bg:#FFF3D9;
  --shadow:0 1px 2px rgba(32,42,48,.05), 0 6px 20px rgba(32,42,48,.06);
  color-scheme: light;
}
:root[data-theme="dark"]{
  --paper:#14181B; --card:#1C2226; --ink:#E9EEF0; --muted:#A5B0B7; --line:#2F383E;
  --tint:#11303A; --accent:var(--b-accent-light); --accent-text:var(--b-accent-light);
  --primary:var(--b-accent-light); --on-primary:#0A1A20; --slate:#93A6B2;
  --good:#71D39E; --good-bg:#15302A; --bad:#FF8E80; --bad-bg:#3B201D; --warn:#F2C46B; --warn-bg:#3A3018;
  --shadow:none;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.55}
h1,h2,h3{font-family:var(--font-head);font-weight:600;line-height:1.2;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:2.1rem} h2{font-size:1.55rem} h3{font-size:1.22rem}
p{margin:0 0 .8em}
a{color:var(--accent-text)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:16px 0}
.mark{width:44px;height:44px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-family:var(--font-head);font-weight:700;font-size:1.05rem;flex:none;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--font-head);font-size:1.2rem;line-height:1.15}
.brand span{font-size:.85rem;color:var(--muted)}
.wordmark img{display:block;height:46px;width:auto;max-width:100%;margin-bottom:2px}
.wordmark .wm-dark,:root[data-theme="dark"] .wordmark .wm-light{display:none}
:root[data-theme="dark"] .wordmark .wm-dark{display:block}
.iconbtn{min-width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;padding:0 12px;font-size:.95rem}
.iconbtn:hover{border-color:var(--slate)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 24px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:1.05rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--slate)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.primary:hover{filter:brightness(1.12)}
.btn.big{min-height:64px;font-size:1.2rem;padding:0 32px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.section{margin:32px 0}
.section > h2{margin-bottom:6px}
.section > .lead{color:var(--muted);margin-bottom:18px}

/* hero */
.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap;padding:28px;background:linear-gradient(135deg,var(--card),var(--tint));}
.hero .info{flex:1 1 320px;min-width:0}
.hero .eyebrow{font-size:.9rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.hero h1{margin:.15em 0 .2em}
.hero .detail{font-size:1.15rem;color:var(--muted);margin-bottom:18px}
.hero-img{flex:0 1 260px;max-width:260px;border-radius:var(--radius);display:block}
.ring{flex:none;position:relative;width:148px;height:148px}
.ring svg{width:148px;height:148px;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .lbl b{font-family:var(--font-head);font-size:2.2rem;display:block}
.ring .lbl span{font-size:.85rem;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.9rem}
.chip.accent{background:var(--tint);border-color:transparent;color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}

/* trail */
.trail{list-style:none;margin:0;padding:0;position:relative}
.trail li{position:relative;display:flex;gap:18px;align-items:center;padding:12px 0}
.trail li:not(:last-child)::after{content:"";position:absolute;left:31px;top:64px;bottom:-12px;width:3px;background:var(--line);border-radius:2px}
.trail li.done:not(:last-child)::after{background:var(--slate)}
.node{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--font-head);font-size:1.4rem;font-weight:700;border:3px solid var(--line);background:var(--card);color:var(--muted);position:relative;z-index:1;overflow:hidden}
.node img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--card)}
.node:has(img){color:transparent}
.locked .node img{filter:grayscale(1);opacity:.45}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero-img{filter:brightness(.88)}}
:root[data-theme="dark"] .hero-img{filter:brightness(.88)}
.done .node::after{content:"¹3";position:absolute;right:2px;bottom:2px;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;font:700 13px/22px var(--font-body);text-align:center;z-index:2}
.win-art{position:absolute;right:24px;top:20px;width:150px;height:150px;border-radius:50%;object-fit:cover;animation:winpop .6s ease-out}
@keyframes winpop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@media (max-width:640px){.win-art{position:static;display:block;width:120px;height:120px;margin:0 auto 12px}}
.done .node{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.current .node{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent)}
.locked .node{border-style:dashed}
.trail .body{flex:1;min-width:0;padding:14px 18px;border-radius:var(--radius-sm);border:1px solid transparent}
.current .body{background:var(--card);border-color:var(--line);box-shadow:var(--shadow)}
.trail .name{font-family:var(--font-head);font-size:1.2rem;font-weight:600}
.trail .meta{color:var(--muted);font-size:.95rem}
.locked .name,.locked .meta{opacity:.7}
.trail .side{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.82rem;font-weight:600;background:var(--tint);color:var(--ink)}
.badge.good{background:var(--good-bg);color:var(--good)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.tile{display:block;text-align:left;width:100%;padding:22px;border-radius:var(--radius);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.tile:hover{border-color:var(--slate)}
.tile b{display:block;font-family:var(--font-head);font-size:1.2rem;margin-bottom:4px}
.tile span{color:var(--muted);font-size:.95rem}
.list{margin:0;padding-left:1.2em}
.list li{margin:.35em 0}
.footer{margin:48px 0 32px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}

/* test */
.testbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.testbar .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.testbar .where{flex:1;min-width:150px}
.testbar .where b{display:block;font-size:1.05rem}
.testbar .where span{font-size:.88rem;color:var(--muted)}
.clock{font-family:var(--font-num);font-size:1.6rem;font-weight:600;padding:4px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad);border-color:var(--bad)}
.pace{display:flex;gap:8px;flex-wrap:wrap;padding:10px 0 2px;font-size:.92rem}
.pace .chip{background:var(--card)}
.pace .chip.ok{color:var(--good)}
.pace .chip.slow{color:var(--warn)}
.tools{display:flex;gap:10px;align-items:center}
.testgrid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:28px;padding-top:22px;padding-bottom:120px}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;color:var(--muted);font-size:.95rem}
.stem{font-family:var(--font-head);font-size:1.45rem;line-height:1.5;margin:0 0 22px;font-weight:500}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:16px;align-items:flex-start;text-align:left;width:100%;min-height:64px;padding:16px 18px;border-radius:var(--radius-sm);border:2px solid var(--line);background:var(--card);font-size:1.15rem;line-height:1.45}
.opt:hover{border-color:var(--slate)}
.opt .L{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--line);font-size:1rem}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
.opt[aria-pressed="true"] .L{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.actions .wrap{display:flex;gap:10px}
.actions .btn{flex:1;min-width:0;padding:0 12px}
.actions .btn.flagged{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.navgrid button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:.9rem;font-family:var(--font-num);position:relative;padding:0}
.navgrid button.ans{background:var(--tint);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.navgrid button.flag::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.navgrid button.cur{outline:3px solid var(--primary);outline-offset:1px}
.side h3{font-size:1.05rem;margin-bottom:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1px solid var(--line);vertical-align:-1px;margin-right:4px}
.coach{margin-top:20px;padding:16px;border-radius:var(--radius-sm);background:var(--tint);font-size:.95rem}
.coach b{display:block;margin-bottom:4px}

/* results */
.verdict{padding:28px;border-radius:var(--radius);position:relative;overflow:hidden}
.verdict.pass{background:var(--good-bg)}
.verdict.fail{background:var(--warn-bg)}
.verdict h1{margin:0 0 .25em}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.bigpct{font-family:var(--font-head);font-size:2.6rem;font-weight:700;line-height:1}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--slate);border-radius:6px}
.bar i.ok{background:var(--good)} .bar i.no{background:var(--bad)}
.bar .mark70{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--font-body)}
.chart .v{fill:var(--ink);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.98rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.tabs button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:transparent}
.rq{padding:20px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);margin-bottom:12px}
.rq .stem{font-size:1.15rem;margin-bottom:12px}
.rq ol{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.rq li{padding:8px 12px;border-radius:10px;border:1px solid var(--line)}
.rq li.right{border-color:var(--good);background:var(--good-bg)}
.rq li.wrong{border-color:var(--bad);background:var(--bad-bg)}
.why{padding:12px 14px;border-left:4px solid var(--accent);background:var(--tint);border-radius:0 10px 10px 0}

/* celebration */
.burst{position:absolute;right:36px;top:30px;width:90px;height:90px;pointer-events:none}
.burst span{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:0;animation:burst 1.6s ease-out .2s forwards}
.burst .ringc{position:absolute;inset:0;border-radius:50%;border:3px solid var(--good);opacity:0;animation:ringc 1.4s ease-out forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) rotate(var(--a)) translateY(0);opacity:1}100%{transform:translate(-50%,-50%) rotate(var(--a)) translateY(-58px);opacity:0}}
@keyframes ringc{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.15);opacity:0}}
@media (prefers-reduced-motion: reduce){.burst{display:none}.win-art{animation:none}}

/* forms */
.field{margin-bottom:22px}
.field > label,.field > .lbl{display:block;font-weight:600;margin-bottom:8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-height:52px;padding:0 18px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
select{width:100%;min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:0 14px;font-size:1.05rem}
.help{font-size:.9rem;color:var(--muted);margin-top:6px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,20,24,.5);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);color:var(--ink);border-radius:var(--radius);padding:28px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.calc{width:min(340px,100%)}
.calc .disp{font-family:var(--font-num);font-size:2rem;text-align:right;padding:12px 14px;border-radius:12px;background:var(--paper);border:1px solid var(--line);margin-bottom:12px;overflow:hidden;text-overflow:ellipsis}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc .keys button{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:1.25rem;font-weight:600}
.calc .keys button.op{background:var(--tint)}
.calc .keys button.eq{background:var(--primary);color:var(--on-primary);border-color:transparent}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--primary);color:var(--on-primary);padding:14px 20px;border-radius:14px;z-index:60;max-width:calc(100% - 32px);font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2)}

@media (max-width: 899px){
  .testgrid{grid-template-columns:1fr;gap:16px}
  .testgrid .side{order:-1}
  .testgrid .side.closed .navwrap{display:none}
}
@media (min-width: 900px){ .gridtoggle{display:none} }
@media (max-width: 640px){
  body{font-size:17px}
  .wrap{padding:0 16px}
  h1{font-size:1.75rem} h2{font-size:1.35rem}
  .hero{padding:22px;gap:18px}
  .ring,.ring svg{width:116px;height:116px}
  .ring .lbl b{font-size:1.8rem}
  .hero-img{max-width:100%;flex-basis:100%}
  .stem{font-size:1.25rem}
  .opt{font-size:1.08rem;padding:14px}
  .clock{font-size:1.3rem;padding:4px 10px}
  .card{padding:18px}
  .node{width:52px;height:52px;font-size:1.15rem}
  .trail li{gap:12px}
  .trail li:not(:last-child)::after{left:25px;top:52px}
  .trail .body{padding:10px 12px}
  .bigpct{font-size:2.1rem}
  .actions .btn{font-size:1rem}
  .testbar .where{min-width:0}
  .testbar .where span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
  .testbar .wrap{gap:8px;padding-top:8px;padding-bottom:8px}
  .tools{width:100%;gap:8px}
  .tools .btn{flex:1;padding:0 12px}
  .pace{flex-wrap:nowrap;overflow-x:auto;padding-top:0;padding-bottom:8px;scrollbar-width:none}
  .pace .chip{white-space:nowrap}
  .pace .chip.extra{display:none}
  .testgrid{padding-top:14px}
  .testgrid .side.closed{display:none}
  .burst{right:12px;top:12px;width:70px;height:70px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalroot"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<input type="file" id="importfile" accept=".json,application/json" class="hidden">
<noscript><p style="padding:20px">This app needs JavaScript turned on.</p></noscript>

<script src="data.js"></script>

<!-- ===== CORE: pure functions (no DOM). Unit-tested by test_scoring.js ===== -->
<script id="core">
const PASS_PCT_DEFAULT = 70;
const PRETEST_FRACTION = 0.1;

// The conditioning ladder. min = minutes. Two parts = graded separately, own timers.
const LEVELS = [
  {id:'L1',  name:'Warm-up',          parts:[{key:'mixed',   n:10, min:12}]},
  {id:'L2',  name:'First mile',       parts:[{key:'mixed',   n:15, min:20}]},
  {id:'L3',  name:'Steady 25',        parts:[{key:'mixed',   n:25, min:35}]},
  {id:'L4',  name:'Forty in the bank',parts:[{key:'general', n:40, min:55}]},
  {id:'L5',  name:'State law, full part', parts:[{key:'ma',  n:40, min:90}]},
  {id:'L6',  name:'Sixty',            parts:[{key:'general', n:60, min:80}]},
  {id:'L7',  name:'General, full part', parts:[{key:'general', n:80, min:150}]},
  {id:'L8',  name:'The long run',     parts:[{key:'general', n:80, min:150},{key:'ma', n:20, min:45}]},
  {id:'L9',  name:'Full simulation',  parts:[{key:'general', n:80, min:150},{key:'ma', n:40, min:90}], pretest:true},
  {id:'L10', name:'Dress rehearsal',  parts:[{key:'general', n:80, min:150},{key:'ma', n:40, min:90}], pretest:true, passPct:75}
];

function levelTotals(lv){
  return {n: lv.parts.reduce((a,p)=>a+p.n,0), min: lv.parts.reduce((a,p)=>a+p.min,0)};
}

function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rng){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// n questions from pool; if the pool is too small, questions repeat (reshuffled each round).
function pickQuestions(pool, n, rng){
  if (!pool.length || n <= 0) return [];
  let out = [];
  while (out.length < n) out = out.concat(shuffle(pool, rng));
  return out.slice(0, n);
}

// spec: {mode, levelId, title, passPct, pretest, parts:[{key, n, min|null, label?, pool?}]}
function buildSession(spec, questions, opts){
  opts = opts || {};
  const rng = opts.rng || Math.random;
  const gen = questions.filter(q => q.part === 'general');
  const ma  = questions.filter(q => q.part === 'ma');
  const items = [], parts = [];
  let repeats = false;
  spec.parts.forEach((p, pi) => {
    let picked;
    if (p.pool) picked = pickQuestions(p.pool, p.n, rng);
    else if (p.key === 'mixed'){
      const nM = (gen.length && ma.length) ? Math.round(p.n / 3) : (gen.length ? 0 : p.n);
      picked = shuffle(pickQuestions(gen, p.n - nM, rng).concat(pickQuestions(ma, nM, rng)), rng);
    } else {
      const pool = p.key === 'ma' ? ma : gen;
      picked = pickQuestions(pool.length ? pool : questions, p.n, rng);
    }
    if (new Set(picked.map(q => q.id)).size < picked.length) repeats = true;
    const start = items.length;
    picked.forEach(q => items.push({qid:q.id, part:pi, pretest:false, choice:null, flagged:false, guessed:false, timeSec:0, visits:0}));
    if (spec.pretest && picked.length >= 10){
      const k = Math.round(picked.length * PRETEST_FRACTION);
      const idx = shuffle(items.slice(start).map((_, i) => start + i), rng).slice(0, k);
      idx.forEach(i => { items[i].pretest = true; });
    }
    parts.push({key:p.key, label:p.label || null, limitSec: p.min ? Math.round(p.min * 60) : null,
      elapsedSec:0, timedOut:false, submitted:false, start, end:items.length, pass:1});
  });
  return {id:'s' + Date.now().toString(36) + Math.floor(rng()*1e6).toString(36),
    mode:spec.mode || 'practice', levelId:spec.levelId || null, title:spec.title || 'Practice',
    passPct:spec.passPct || PASS_PCT_DEFAULT, createdAt:Date.now(), parts, items,
    cur:0, partIdx:0, started:false, repeats};
}

function round1(x){ return Math.round(x * 10) / 10; }

function isRight(item, qmap){
  const q = qmap[item.qid];
  return !!q && item.choice !== null && item.choice === q.c;
}

function bucketStats(list, qmap){
  const scored = list.filter(it => !it.pretest);
  const correct = scored.filter(it => isRight(it, qmap)).length;
  const t = list.reduce((a, it) => a + it.timeSec, 0);
  return {n:list.length, scored:scored.length, correct,
    acc: scored.length ? round1(correct / scored.length * 100) : null,
    avgSec: list.length ? round1(t / list.length) : null};
}

// Everything the results screen needs. Pretest items never count toward scores or stamina accuracy.
function scoreSession(s, qmap){
  const pp = s.passPct || PASS_PCT_DEFAULT;
  const parts = s.parts.map(p => {
    const its = s.items.slice(p.start, p.end);
    const sc = its.filter(it => !it.pretest);
    const correct = sc.filter(it => isRight(it, qmap)).length;
    const pct = sc.length ? round1(correct / sc.length * 100) : 0;
    return {key:p.key, label:p.label, scored:sc.length, correct, pct, pass: sc.length > 0 && pct >= pp,
      needed: Math.ceil(sc.length * pp / 100), timeUsed: Math.round(p.elapsedSec), limitSec:p.limitSec,
      timedOut:p.timedOut, unanswered: its.filter(it => it.choice === null).length, total: its.length};
  });
  const scoredAll = s.items.filter(it => !it.pretest);
  const correctAll = scoredAll.filter(it => isRight(it, qmap)).length;
  const timeOk = s.parts.every(p => !p.timedOut);
  const allPartsPass = parts.every(p => p.pass);

  // Stamina: split by position in the test (question 1..N across all parts).
  const N = s.items.length;
  const quarters = [0,1,2,3].map(b => bucketStats(s.items.filter((_, i) => Math.min(3, Math.floor(i * 4 / N)) === b), qmap));
  const halves = [0,1].map(b => bucketStats(s.items.filter((_, i) => (i < N / 2 ? 0 : 1) === b), qmap));
  const fade = (halves[0].acc !== null && halves[1].acc !== null) ? round1(halves[0].acc - halves[1].acc) : null;
  const paceChange = (halves[0].avgSec !== null && halves[1].avgSec !== null) ? round1(halves[1].avgSec - halves[0].avgSec) : null;

  const topicMap = {};
  scoredAll.forEach(it => {
    const q = qmap[it.qid]; if (!q) return;
    const k = q.part + '|' + q.topic;
    const t = topicMap[k] || (topicMap[k] = {topic:q.topic, part:q.part, n:0, correct:0});
    t.n++; if (isRight(it, qmap)) t.correct++;
  });
  const topics = Object.values(topicMap).map(t => Object.assign(t, {pct: round1(t.correct / t.n * 100)}))
    .sort((a, b) => a.pct - b.pct || b.n - a.n);

  // Traps: "fooled" = picked a wrong answer (blanks are not counted as fooled).
  const trapMap = {};
  scoredAll.forEach(it => {
    const q = qmap[it.qid]; if (!q) return;
    const k = q.trap || 'none';
    const t = trapMap[k] || (trapMap[k] = {trap:k, seen:0, fooled:0});
    t.seen++;
    if (it.choice !== null && !isRight(it, qmap)) t.fooled++;
  });
  const traps = Object.values(trapMap).map(t => Object.assign(t, {rate: round1(t.fooled / t.seen * 100)}))
    .sort((a, b) => b.fooled - a.fooled || b.rate - a.rate);

  const guessed = s.items.filter(it => it.guessed && !it.pretest);
  return {
    parts, scored:scoredAll.length, correct:correctAll,
    pct: scoredAll.length ? round1(correctAll / scoredAll.length * 100) : 0,
    timeOk, allPartsPass, passed: allPartsPass && timeOk, passPct:pp,
    quarters, halves, fade, paceChange, topics, traps,
    flagged: s.items.filter(it => it.flagged).length,
    blanks: s.items.filter(it => it.choice === null).length,
    guessed: guessed.length, guessedRight: guessed.filter(it => isRight(it, qmap)).length,
    pretestCount: s.items.filter(it => it.pretest).length,
    totalSec: Math.round(s.parts.reduce((a, p) => a + p.elapsedSec, 0))
  };
}

function fadeLabel(f){
  if (f === null) return 'Not enough data';
  if (f <= 0) return 'No fade';
  if (f <= 5) return 'Slight fade';
  if (f <= 10) return 'Moderate fade';
  return 'Big fade';
}

// Consecutive days (YYYY-MM-DD) ending today, or yesterday if nothing yet today.
function dayShift(day, delta){
  const [y, m, d] = day.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d + delta)).toISOString().slice(0, 10);
}
function streakFrom(days, today){
  const set = new Set(days);
  let d = set.has(today) ? today : dayShift(today, -1);
  let n = 0;
  while (set.has(d)){ n++; d = dayShift(d, -1); }
  return n;
}

function isUnlocked(idx, levelProgress, unlockAll){
  if (unlockAll || idx === 0) return true;
  const prev = levelProgress[LEVELS[idx - 1].id];
  return !!(prev && prev.passed);
}
function nextLevelIndex(levelProgress){
  const i = LEVELS.findIndex(l => !(levelProgress[l.id] && levelProgress[l.id].passed));
  return i === -1 ? LEVELS.length - 1 : i;
}
</script>

function hexToRgb(h){ h = String(h).replace('#',''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbToHex(r){ return '#' + r.map(v => Math.round(v).toString(16).padStart(2,'0')).join(''); }
function lum(h){ const a = hexToRgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126*a[0] + 0.7152*a[1] + 0.0722*a[2]; }
function contrast(a, b){ const x = lum(a), y = lum(b); return (Math.max(x,y) + 0.05) / (Math.min(x,y) + 0.05); }

    ${SC.examSite ? `<section class="section"><h2>Exam day</h2><p>${esc(SC.examSite)}</p>${SC.contact ? `<p class="muted">${esc(typeof SC.contact === 'string' ? SC.contact : [SC.contact.name, SC.contact.phone, SC.contact.email].filter(Boolean).join(' · '))}</p>` : ''}</section>` : ''}

      <div class="row">
        <button class="btn" data-act="export">Save a backup</button>
        <button class="btn" data-act="import">Load a backup</button>
        <button class="btn ghost" data-act="settings">Settings</button>
      </div>
      <p style="margin-top:16px">Your progress stays on this device. Save a backup to move it to another one.</p>
    </footer>
  </main>`;
}

/* ---------- starting sessions ---------- */
function startLevel(i){
  const lv = LEVELS[i];
  if (!isUnlocked(i, ST.levels, ST.settings.unlockAll)) return toast('Pass level ' + i + ' first.');
  const s = buildSession({mode:'level', levelId:lv.id, title:'Level ' + (i+1) + ': ' + lv.name, passPct:lv.passPct, pretest:lv.pretest,
    parts:lv.parts.map(p => ({key:p.key, n:p.n, min:p.min}))}, QS, {rng:mulberry32(Date.now() & 0x7fffffff)});
  ST.active = s; save(); view = 'brief'; render();
}
function paceSec(key){ return key === 'ma' ? 135 : 112; } // real exam: 150 min/80 q, 90 min/40 q
function startPractice(){
  const f = practiceForm;
  let pool = QS.filter(q => (f.part === 'all' || q.part === f.part) && (!f.topic || q.topic === f.topic));
  if (!pool.length) return toast('No questions match that choice yet.');
  const n = f.n;
  const min = f.pace === 'none' ? null : Math.ceil(n * (f.pace === 'relaxed' ? 150 : paceSec(f.part)) / 60);
  const s = buildSession({mode:'practice', title:'Practice: ' + (f.topic || (f.part === 'all' ? 'All topics' : PART_NAME[f.part])),
    parts:[{key:f.part === 'all' ? 'mixed' : f.part, n, min, pool, label:f.topic || null}]}, QS, {rng:mulberry32(Date.now() & 0x7fffffff)});
  ST.active = s; save(); view = 'brief'; render();
}
function startDrill(){
  const ids = missedIds();
  if (!ids.length) return toast('No missed questions yet. Nice.');
  const pool = ids.map(id => QMAP[id]);
  const n = Math.min(25, pool.length);
  const s = buildSession({mode:'drill', title:'Missed-question drill',
    parts:[{key:'mixed', n, min:Math.ceil(n * 120 / 60), pool, label:'Missed questions'}]}, QS, {rng:mulberry32(Date.now() & 0x7fffffff)});
  ST.active = s; save(); view = 'brief'; render();
}

function viewBrief(){
  const s = ST.active, p = s.parts[s.partIdx], n = p.end - p.start;
  const pace = p.limitSec ? Math.round(p.limitSec / n) : null;
  const multi = s.parts.length > 1;
  return header() + `<main class="wrap" style="max-width:760px">
    <div class="section">
      <div class="eyebrow small muted" style="font-weight:600;text-transform:uppercase;letter-spacing:.06em">${multi ? 'Part ' + (s.partIdx + 1) + ' of ' + s.parts.length : 'Ready?'}</div>
      <h1>${esc(s.title)}</h1>
      <p style="font-size:1.2rem">${multi ? esc(partName(p)) + ': ' : ''}<b>${n} questions</b>${p.limitSec ? ' in <b>' + fmtMin(Math.round(p.limitSec/60)) + '</b>' : ', no timer'}.${pace ? ' That is about <b>' + pace + ' seconds</b> a question.' : ''}</p>
      ${multi ? `<p class="muted">Each part is graded on its own. You need ${s.passPct}% in each. Once you submit a part you can't go back to it, just like the real exam.</p>` : ''}
      ${s.repeats ? `<p class="badge warn" style="display:inline-block">The question bank is small, so some questions repeat.</p>` : ''}
    </div>
    <div class="card">
      <h2>The plan for this workout</h2>
      <ol class="list" style="font-size:1.08rem">${PASS_COACH.map(t => `<li>${esc(t)}</li>`).join('')}</ol>
      <p class="muted" style="margin-top:12px">Your guess letter is <b>${guessLetter()}</b>. Pick one letter and use it every time you have to guess.</p>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Keyboard shortcuts</h3>
      <p class="muted small" style="margin:0">1-4 or A-D answer · F flag · N or &rarr; next · P or &larr; back · R review · K calculator</p>
    </div>
    <div class="row" style="margin:28px 0 40px">
      <button class="btn primary big" data-act="begin">Start the clock</button>
      <button class="btn ghost" data-act="abandon">Not now</button>
    </div>
  </main>`;
}

/* ---------- test ---------- */
function curPart(){ return ST.active.parts[ST.active.partIdx]; }
function partItems(){ const p = curPart(); return ST.active.items.slice(p.start, p.end); }
function begin(){
  const s = ST.active, p = curPart();
  s.started = true; if (s.cur < p.start || s.cur >= p.end) s.cur = p.start;
  s.items[s.cur].visits++;
  view = 'test'; save(); render(); startTimer();
}

function paceInfo(){
  const s = ST.active, p = curPart(), its = partItems(), n = its.length;
  const answered = its.filter(it => it.choice !== null).length;
  const flagged = its.filter(it => it.flagged).length;
  const target = p.limitSec ? p.limitSec / n : null;
  const avg = answered ? p.elapsedSec / answered : null;
  const open = n - answered;
  const left = p.limitSec ? Math.max(0, p.limitSec - p.elapsedSec) : null;
  return {n, answered, flagged, target, avg, open, left, perOpen: (left !== null && open) ? left / open : null};
}
function paceHtml(){
  const pi = paceInfo();
  const out = [`<span class="chip">Answered <b class="num">&nbsp;${pi.answered}/${pi.n}</b></span>`, `<span class="chip">Flagged <b class="num">&nbsp;${pi.flagged}</b></span>`];
  if (pi.target){
    if (pi.avg !== null){
      const ok = pi.avg <= pi.target;
      out.push(`<span class="chip ${ok ? 'ok' : 'slow'}" title="Average time per answered question, compared with the time you have per question">${ok ? 'On pace' : 'Behind pace'}: <b class="num">&nbsp;${Math.round(pi.avg)}s</b>&nbsp;/ q (goal ${Math.round(pi.target)}s)</span>`);
    } else out.push(`<span class="chip">Goal: about ${Math.round(pi.target)}s a question</span>`);
    if (pi.perOpen !== null) out.push(`<span class="chip extra">${Math.round(pi.perOpen)}s left for each open question</span>`);
  }
  return out.join('');
}
function clockText(){
  const p = curPart();
  return p.limitSec ? fmtClock(p.limitSec - p.elapsedSec) : fmtClock(p.elapsedSec);
}

function viewTest(){
  const s = ST.active, p = curPart(), it = s.items[s.cur], q = QMAP[it.qid];
  const idx = s.cur - p.start + 1, n = p.end - p.start;
  const low = p.limitSec && p.limitSec - p.elapsedSec < 300;
  const grid = partItems().map((x, i) => {
    const gi = p.start + i;
    const cls = [x.choice !== null ? 'ans' : '', x.flagged ? 'flag' : '', gi === s.cur ? 'cur' : ''].join(' ');
    return `<button class="${cls}" data-act="go" data-i="${gi}" aria-label="Question ${i+1}${x.choice !== null ? ', answered' : ''}${x.flagged ? ', flagged' : ''}">${i+1}</button>`;
  }).join('');
  const passNo = Math.min(p.pass || 1, PASS_COACH.length);
  return `<div class="testbar"><div class="wrap">
      <div class="where"><b>Question ${idx} of ${n}</b><span>${esc(s.title)}${s.parts.length > 1 ? ' · ' + esc(partName(p)) : ''}</span></div>
      <div class="clock ${low ? 'low' : ''}" id="clock" role="timer" aria-label="Time ${p.limitSec ? 'left' : 'used'}">${clockText()}</div>
      <div class="tools"><button class="iconbtn" data-act="calc" title="Calculator (K)">Calc</button>
      <button class="iconbtn gridtoggle" data-act="grid" aria-expanded="${gridOpen}">${gridOpen ? 'Hide list' : 'All questions'}</button>
      <button class="btn primary" style="min-height:48px" data-act="review">Review &amp; submit</button></div>
    </div>
    <div class="wrap"><div class="pace" id="pace">${paceHtml()}</div></div>
  </div>
  <main class="wrap testgrid">
    <section aria-live="polite">
      <div class="qhead"><span class="badge">${esc(q.topic)}</span>${it.flagged ? '<span class="badge warn">Flagged</span>' : ''}</div>
      <p class="stem">${esc(q.q)}</p>
      <div class="opts" role="group" aria-label="Answers">
        ${q.a.map((a, k) => `<button class="opt" data-act="pick" data-k="${k}" aria-pressed="${it.choice === k}"><span class="L">${LETTERS[k]}</span><span>${esc(a)}</span></button>`).join('')}
      </div>
    </section>
    <aside class="side ${gridOpen ? '' : 'closed'}">
      <div class="navwrap">
        <h3>All questions</h3>
        <div class="navgrid">${grid}</div>
        <div class="legend"><span><i style="background:var(--tint)"></i>answered</span><span><i style="background:var(--warn);border-radius:50%"></i>flagged</span></div>
      </div>
      <div class="coach"><b>Strategy right now</b>${esc(PASS_COACH[passNo - 1])}</div>
    </aside>
  </main>
  <nav class="actions" aria-label="Question actions"><div class="wrap" style="max-width:820px">
    <button class="btn" data-act="prev" ${s.cur <= p.start ? 'disabled' : ''}>Back</button>
    <button class="btn ${it.flagged ? 'flagged' : ''}" data-act="flag" aria-pressed="${it.flagged}">${it.flagged ? 'Flagged' : 'Flag'}</button>
    <button class="btn primary" data-act="next">${it.choice === null ? 'Skip' : 'Next'}</button>
  </div></nav>`;
}

function go(i){
  const s = ST.active, p = curPart();
  if (i < p.start || i >= p.end) return;
  s.cur = i; s.items[i].visits++; view = 'test'; render();
}
function next(){
  const s = ST.active, p = curPart();
  if (s.cur < p.end - 1) return go(s.cur + 1);
  const open = s.items.findIndex((it, i) => i >= p.start && i < p.end && (it.choice === null || it.flagged));
  if (open === -1) return showReview();
  p.pass = Math.min(PASS_COACH.length, (p.pass || 1) + 1);
  go(open);
  toast(PASS_COACH[p.pass - 1], 4500);
}
function prev(){ const s = ST.active; if (s.cur > curPart().start) go(s.cur - 1); }
function pick(k){ const it = ST.active.items[ST.active.cur]; it.choice = k; it.guessed = false; save(); render(); }
function flag(){ const it = ST.active.items[ST.active.cur]; it.flagged = !it.flagged; save(); render(); }
function showReview(){ view = 'review'; render(); }

function viewReview(){
  const s = ST.active, p = curPart(), its = partItems(), pi = paceInfo();
  const blanks = its.filter(it => it.choice === null).length;
  const grid = its.map((x, i) => `<button class="${[x.choice !== null ? 'ans' : '', x.flagged ? 'flag' : ''].join(' ')}" data-act="go" data-i="${p.start + i}" aria-label="Question ${i+1}">${i+1}</button>`).join('');
  const last = s.partIdx === s.parts.length - 1;
  return `<div class="testbar"><div class="wrap">
      <div class="where"><b>Review before you submit</b><span>${esc(s.title)}${s.parts.length > 1 ? ' · ' + esc(partName(p)) : ''}</span></div>
      <div class="clock" id="clock" role="timer">${clockText()}</div>
    </div><div class="wrap"><div class="pace" id="pace">${paceHtml()}</div></div></div>
  <main class="wrap" style="padding-top:24px;padding-bottom:60px;max-width:820px">
    <div class="parts" style="margin-bottom:20px">
      <div class="card"><div class="bigpct">${blanks}</div><div class="muted">unanswered</div></div>
      <div class="card"><div class="bigpct">${pi.flagged}</div><div class="muted">flagged</div></div>
      <div class="card"><div class="bigpct">${pi.answered}</div><div class="muted">answered</div></div>
    </div>
    ${blanks ? `<div class="card" style="margin-bottom:20px;background:var(--warn-bg);border-color:transparent"><p><b>Don't leave blanks.</b> A blank is always wrong. A guess might be right.</p><button class="btn" data-act="fillGuess">Answer all ${blanks} blank${blanks === 1 ? '' : 's'} with ${guessLetter()}</button></div>` : ''}
    <h2>Tap a number to go back to it</h2>
    <div class="navgrid" style="margin-bottom:28px">${grid}</div>
    <div class="row">
      <button class="btn big" data-act="backToTest">Back to questions</button>
      <button class="btn primary big" data-act="submitPart">${last ? 'Submit and see my results' : 'Submit part ' + (s.partIdx + 1)}</button>
    </div>
    <p class="muted small" style="margin-top:12px">${last ? '' : "After you submit this part you can't come back to it."}</p>
  </main>`;
}
function fillGuess(){
  const k = LETTERS.indexOf(guessLetter());
  partItems().forEach(it => { if (it.choice === null){ it.choice = k; it.guessed = true; } });
  save(); render(); toast('Blanks filled with ' + guessLetter() + '.');
}

function submitPart(timedOut){
  const s = ST.active, p = curPart();
  if (timedOut){ p.timedOut = true; p.elapsedSec = p.limitSec; }
  p.submitted = true;
  stopTimer();
  if (s.partIdx < s.parts.length - 1){
    s.partIdx++; s.cur = curPart().start; save();
    view = 'between'; render();
    if (timedOut) toast("Time's up for that part.");
  } else finish(timedOut);
}
function viewBetween(){
  const s = ST.active, p = curPart(), n = p.end - p.start;
  return header() + `<main class="wrap" style="max-width:720px">
    <div class="section card" style="text-align:center;padding:40px 24px">
      <div class="eyebrow small muted" style="font-weight:600;text-transform:uppercase;letter-spacing:.06em">Part ${s.partIdx} done</div>
      <h1>Take a breath.</h1>
      <p style="font-size:1.15rem">Stand up, stretch, drink some water. Scores come at the very end.</p>
      <p style="font-size:1.15rem">Next: <b>${esc(partName(p))}</b> · ${n} questions${p.limitSec ? ' · ' + fmtMin(Math.round(p.limitSec / 60)) : ''}</p>
      <button class="btn primary big" data-act="begin">Start part ${s.partIdx + 1}</button>
    </div>
  </main>`;
}

function finish(timedOut){
  const s = ST.active, r = scoreSession(s, QMAP);
  celebrate = false;
  if (s.mode === 'level'){
    const lv = LEVELS.find(l => l.id === s.levelId);
    const ls = ST.levels[s.levelId] || {attempts:0, best:null, passed:false};
    ls.attempts++;
    ls.best = ls.best === null ? r.pct : Math.max(ls.best, r.pct);
    if (r.passed && !ls.passed){ ls.passed = true; celebrate = true; }
    ST.levels[s.levelId] = ls;
  }
  s.items.forEach(it => {
    const q = QMAP[it.qid]; if (!q) return;
    const st = ST.qstats[it.qid] || {seen:0, right:0, last:null};
    const ok = isRight(it, QMAP);
    st.seen++; if (ok) st.right++; st.last = ok;
    ST.qstats[it.qid] = st;
  });
  ST.history.unshift({id:s.id, at:Date.now(), day:today(), mode:s.mode, levelId:s.levelId, title:s.title, pct:r.pct, passed:r.passed,
    timeOk:r.timeOk, fade:r.fade, n:s.items.length, parts:r.parts.map(p => ({label:partName(p), pct:p.pct, pass:p.pass}))});
  ST.history = ST.history.slice(0, 200);
  ST.saved = [s].concat(ST.saved.filter(x => x.id !== s.id)).slice(0, 8);
  ST.active = null; save();
  resultSession = s; reviewFilter = 'all'; view = 'results'; render();
  if (timedOut) toast("Time's up. Here is how it went.");
}

/* ---------- timer ---------- */
let timer = null, lastTick = 0, lastSave = 0;
function startTimer(){ stopTimer(); lastTick = performance.now(); timer = setInterval(tick, 250); }
function stopTimer(){ if (timer){ clearInterval(timer); timer = null; } }
function stopTimerIfIdle(){ if (view !== 'test' && view !== 'review') stopTimer(); }
function tick(){
  const s = ST.active; if (!s){ stopTimer(); return; }
  const now = performance.now(), dt = Math.min(5, (now - lastTick) / 1000); lastTick = now;
  const p = curPart();
  p.elapsedSec += dt;
  if (view === 'test') s.items[s.cur].timeSec += dt;
  if (p.limitSec && p.elapsedSec >= p.limitSec){ submitPart(true); return; }
  const c = $('#clock');
  if (c){ c.textContent = clockText(); c.classList.toggle('low', !!(p.limitSec && p.limitSec - p.elapsedSec < 300)); }
  const pc = $('#pace'); if (pc && Math.floor(p.elapsedSec) !== Math.floor(p.elapsedSec - dt)) pc.innerHTML = paceHtml();
  if (now - lastSave > 5000){ lastSave = now; save(); }
}

/* ---------- results ---------- */
function barChart(vals, o){
  const W = 320, H = 190, padL = 8, padB = 30, padT = 26, bw = 52, gap = (W - padL * 2 - bw * vals.length) / (vals.length - 1 || 1);
  const max = o.max || Math.max(1, ...vals.map(v => v.value || 0), o.ref || 0) * 1.15;
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">`;
  svg += `<line x1="${padL}" x2="${W - padL}" y1="${H - padB}" y2="${H - padB}" stroke="var(--line)" stroke-width="1.5"/>`;
  vals.forEach((v, i) => {
    const x = padL + i * (bw + gap);
    if (v.value === null || v.value === undefined){
      svg += `<text x="${x + bw/2}" y="${H - padB - 8}" text-anchor="middle" font-size="12">n/a</text>`;
    } else {
      const top = y(v.value), color = o.color ? o.color(v.value) : 'var(--slate)';
      svg += `<rect x="${x}" y="${top}" width="${bw}" height="${Math.max(2, H - padB - top)}" rx="6" fill="${color}"/>`;
      svg += `<text class="v" x="${x + bw/2}" y="${top - 7}" text-anchor="middle" font-size="13">${esc(o.fmt(v.value))}</text>`;
    }
    svg += `<text x="${x + bw/2}" y="${H - 10}" text-anchor="middle" font-size="12">${esc(v.label)}</text>`;
  });
  if (o.ref){
    const ry = y(o.ref);
    svg += `<line x1="${padL}" x2="${W - padL}" y1="${ry}" y2="${ry}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    svg += `<text x="${W - padL}" y="${ry - 6}" text-anchor="end" font-size="11" font-weight="600" fill="var(--ink)" stroke="var(--card)" stroke-width="4" stroke-linejoin="round" paint-order="stroke">${esc(o.refLabel)}</text>`;
  }
  return svg + '</svg>';
}

function staminaAdvice(r){
  if (r.fade === null) return 'Run a longer level to see your stamina.';
  const small = r.halves[0].scored < 10;
  let t;
  if (r.fade > 10) t = `You lost ${r.fade} points in the second half. That is the fade instructors warn about. Keep climbing the levels, and at the halfway mark take 20 seconds: sit back, breathe slowly, then continue.`;
  else if (r.fade > 5) t = `A small drop of ${r.fade} points in the second half. Watch for it as the levels get longer.`;
  else if (r.fade <= 0) t = `No fade: your second half was as good or better than your first. That is the goal.`;
  else t = `Very steady: only ${r.fade} points lower in the second half.`;
  if (r.paceChange !== null && r.paceChange < -15 && r.fade > 5) t += ` You also sped up by ${Math.abs(Math.round(r.paceChange))}s a question near the end. Rushing usually costs points.`;
  else if (r.paceChange !== null && r.paceChange > 20) t += ` You slowed down by ${Math.round(r.paceChange)}s a question in the second half; that is a sign of tiredness.`;
  if (small) t += ' (Short workout, so treat this as a rough read.)';
  return t;
}

function viewResults(){
  const s = resultSession, r = scoreSession(s, QMAP);
  const lvIdx = s.levelId ? LEVELS.findIndex(l => l.id === s.levelId) : -1;
  const nextIdx = lvIdx >= 0 && r.passed && lvIdx < LEVELS.length - 1 ? lvIdx + 1 : -1;
  let reason = '';
  if (!r.passed){
    const why = [];
    r.parts.forEach(p => { if (!p.pass) why.push(`${esc(partName(p))} was ${p.pct}% (need ${r.passPct}%)`); });
    s.parts.forEach(p => { if (p.timedOut) why.push(`time ran out in ${esc(partName(p))}`); });
    reason = why.join('; ') + '.';
  }
  const head = s.mode === 'level'
    ? (r.passed ? (nextIdx >= 0 ? `Level ${lvIdx + 1} passed. Level ${nextIdx + 1} is open.` : `Level ${lvIdx + 1} passed. Plan complete.`) : 'Not yet. Good training though.')
    : (r.passed ? 'Passed.' : 'Below the line this time.');
  const sub = r.passed ? `You scored ${r.pct}% and finished inside the time.` : `What held you back: ${reason} Run it again when you are ready.`;
  const burst = celebrate ? `<div class="burst" aria-hidden="true"><div class="ringc"></div>${Array.from({length:10}, (_, i) => `<span style="--a:${i*36}deg;${i % 2 ? 'background:var(--good)' : ''}"></span>`).join('')}</div>` : '';

  const partCards = r.parts.map((p, i) => `<div class="card">
    <div class="muted">${esc(partName(s.parts[i]))}</div>
    <div class="row" style="justify-content:space-between;margin:6px 0 10px"><span class="bigpct">${p.pct}%</span><span class="badge ${p.pass ? 'good' : 'bad'}">${p.pass ? 'Pass' : 'Below ' + r.passPct + '%'}</span></div>
    <div class="bar" aria-hidden="true"><i class="${p.pass ? 'ok' : 'no'}" style="width:${p.pct}%"></i><span class="mark70" style="left:${r.passPct}%"></span></div>
    <p class="small muted" style="margin:10px 0 0">${p.correct} of ${p.scored} scored right (need ${p.needed})${p.unanswered ? ' · ' + p.unanswered + ' blank' : ''}<br>
    Time ${fmtClock(p.timeUsed)}${p.limitSec ? ' of ' + fmtClock(p.limitSec) : ''}${p.timedOut ? ' · <b style="color:var(--bad)">ran out</b>' : ''}</p></div>`).join('');

  const target = s.parts[0].limitSec ? Math.round(s.parts.reduce((a, p) => a + (p.limitSec || 0), 0) / s.items.length) : null;
  const accChart = barChart(r.quarters.map((q, i) => ({label:'Q' + (i+1), value:q.acc})), {max:100, ref:r.passPct, refLabel:r.passPct + '% line', fmt:v => Math.round(v) + '%', aria:'Accuracy by quarter of the test', color:v => v >= r.passPct ? 'var(--slate)' : 'var(--bad)'});
  const secChart = barChart(r.quarters.map((q, i) => ({label:'Q' + (i+1), value:q.avgSec})), {ref:target, refLabel:target ? 'goal ' + target + 's' : '', fmt:v => Math.round(v) + 's', aria:'Seconds per question by quarter of the test'});
  const fadeTxt = r.fade === null ? 'n/a' : (r.fade > 0 ? '-' + r.fade : '+' + Math.abs(r.fade));

  const topicRows = r.topics.map(t => `<tr><td>${esc(t.topic)}<div class="small muted">${esc(PART_NAME[t.part] || t.part)}</div></td><td class="r num">${t.correct}/${t.n}</td>

function reviewList(s){
  const rows = s.items.map((it, i) => ({it, i, q:QMAP[it.qid]})).filter(x => x.q).filter(({it}) =>
    reviewFilter === 'all' || (reviewFilter === 'wrong' && !it.pretest && !isRight(it, QMAP)) || (reviewFilter === 'flag' && it.flagged) || (reviewFilter === 'pre' && it.pretest));
  if (!rows.length) return '<p class="muted">Nothing here.</p>';
  return rows.map(({it, i, q}) => {
    const ok = isRight(it, QMAP);
    const tags = [`<span class="badge ${it.pretest ? 'plain' : (ok ? 'good' : 'bad')}">${it.pretest ? 'Pretest (unscored)' : (ok ? 'Right' : (it.choice === null ? 'Blank' : 'Missed'))}</span>`,
      `<span class="badge plain">${esc(q.topic)}</span>`, `<span class="badge plain">${Math.round(it.timeSec)}s</span>`];
    if (it.flagged) tags.push('<span class="badge warn">Flagged</span>');
    if (it.guessed) tags.push('<span class="badge plain">Guess letter</span>');
    if (q.trap && q.trap !== 'none' && !ok) tags.push(`<span class="badge plain">Trap: ${esc((TRAP_INFO[q.trap] || [q.trap])[0])}</span>`);
    return `<article class="rq"><div class="qhead"><b>Q${i + 1}</b>${tags.join('')}</div>
      <p class="stem">${esc(q.q)}</p>
      <ol>${q.a.map((a, k) => `<li class="${k === q.c ? 'right' : (k === it.choice ? 'wrong' : '')}"><b>${LETTERS[k]}.</b> ${esc(a)}${k === q.c ? ' <span class="small">(correct)</span>' : ''}${k === it.choice && k !== q.c ? ' <span class="small">(your answer)</span>' : ''}</li>`).join('')}</ol>
      ${q.why ? `<div class="why">${esc(q.why)}</div>` : ''}</article>`;
  }).join('');
}

/* calculator */
const calc = {disp:'0', acc:null, op:null, fresh:true};
function calcHtml(){
  const keys = [['C','C'],['back','&#9003;'],['%','%'],['/','&divide;'],['7','7'],['8','8'],['9','9'],['*','&times;'],['4','4'],['5','5'],['6','6'],['-','&minus;'],['1','1'],['2','2'],['3','3'],['+','+'],['neg','&plusmn;'],['0','0'],['.','.'],['=','=']];
  return `<div class="row" style="justify-content:space-between;margin-bottom:10px"><b>Calculator</b><button class="iconbtn" data-act="close" aria-label="Close calculator">Close</button></div>
    <div class="disp num" id="calcdisp" aria-live="polite">${esc(calc.disp)}</div>
    <div class="keys">${keys.map(([k, l]) => `<button data-act="ck" data-k="${k}" class="${'+-*/%'.includes(k) && k.length === 1 ? 'op' : (k === '=' ? 'eq' : '')}" aria-label="${k}">${l}</button>`).join('')}</div>`;
}
function calcEval(){
  const a = calc.acc, b = parseFloat(calc.disp);
  let r = calc.op === '+' ? a + b : calc.op === '-' ? a - b : calc.op === '*' ? a * b : calc.op === '/' ? (b === 0 ? NaN : a / b) : b;
  r = Math.round(r * 1e10) / 1e10;
  calc.disp = isFinite(r) ? String(r) : 'Error'; calc.acc = isFinite(r) ? r : null;
}
function calcPress(k){
  if (calc.disp === 'Error' && k !== 'C'){ calc.disp = '0'; calc.fresh = true; }
  if (/^[0-9]$/.test(k)){ calc.disp = (calc.fresh || calc.disp === '0') ? k : calc.disp + k; calc.fresh = false; }
  else if (k === '.'){ if (calc.fresh){ calc.disp = '0.'; calc.fresh = false; } else if (!calc.disp.includes('.')) calc.disp += '.'; }
  else if (k === 'C'){ calc.disp = '0'; calc.acc = null; calc.op = null; calc.fresh = true; }
  else if (k === 'back'){ if (!calc.fresh) calc.disp = calc.disp.length > 1 ? calc.disp.slice(0, -1) : '0'; }
  else if (k === 'neg'){ calc.disp = String(-parseFloat(calc.disp) || 0); }
  else if (k === '%'){ calc.disp = String(Math.round(parseFloat(calc.disp) / 100 * 1e10) / 1e10); calc.fresh = false; }
  else if ('+-*/'.includes(k)){ if (calc.op && !calc.fresh) calcEval(); else if (!calc.op) calc.acc = parseFloat(calc.disp); calc.op = k; calc.fresh = true; }
  else if (k === '='){ if (calc.op && calc.acc !== null){ calcEval(); } calc.op = null; calc.fresh = true; }
  const d = $('#calcdisp'); if (d) d.textContent = calc.disp;
}

/* ---------- export / import ---------- */
function exportProgress(){
  const data = JSON.stringify(Object.assign({app:'exam-conditioning', exportedAt:new Date().toISOString()}, ST), null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  a.download = 'exam-conditioning-progress-' + today() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Backup saved to your downloads.');
}
$('#importfile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      if (!o || o.version !== 1 || typeof o.levels !== 'object') throw new Error('bad');
      delete o.app; delete o.exportedAt;
      ST = Object.assign(blankState(), o, {settings:Object.assign(blankState().settings, o.settings || {})});
      save(); applyTheme(); view = 'home'; render(); toast('Backup loaded.');
    } catch (err) { toast("That file doesn't look like a backup from this app."); }
    e.target.value = '';
  };
  rd.readAsText(file);
});

});
document.addEventListener('change', e => {

});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (modal === 'calc'){
    const map = {Enter:'=', '=':'=', Backspace:'back', Escape:null, Delete:'C', c:'C', C:'C'};
    if (e.key === 'Escape'){ closeModal(); e.preventDefault(); return; }
    const k = e.key in map ? map[e.key] : e.key;
    if (k && /^([0-9]|[.+\-*/%=]|C|back)$/.test(k)){ calcPress(k); e.preventDefault(); }
    return;
  }
  if (modal){ if (e.key === 'Escape'){ closeModal(); if (modal === null && ST.settings.seenIntro === false){ ST.settings.seenIntro = true; save(); } } return; }
  if (view !== 'test' || (e.target.matches && e.target.matches('input,select,textarea'))) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if ('1234'.includes(k) && k.length === 1) pick(+k - 1);
  else if ('abcd'.includes(k) && k.length === 1) pick(k.charCodeAt(0) - 97);
  else if (k === 'f') flag();
  else if (k === 'n' || k === 'ArrowRight') next();
  else if (k === 'p' || k === 'ArrowLeft') prev();
  else if (k === 'r') showReview();
  else if (k === 'k') openModal(calcHtml(), 'calc');
  else return;
  e.preventDefault();
});
